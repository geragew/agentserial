[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentserial"
version = "0.7.0"
description = "Correctness classification for parallel AI-agent effect histories"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "GERAGEW", email = "GERAGEW@ICLOUD.COM"}]
keywords = ["ai-agents", "concurrency", "verification", "observability", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
api = []
dev = [
  "build>=1.2,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "hypothesis>=6.130,<7",
  "python-multipart>=0.0.20,<1",
  "pytest>=8.2,<10",
  "ruff>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
agentserial = "agentserial.cli:app"

[project.urls]
Homepage = "https://geragew.github.io/agentserial/"
Documentation = "https://github.com/geragew/agentserial#readme"
Source = "https://github.com/geragew/agentserial"
Issues = "https://github.com/geragew/agentserial/issues"
"Release Notes" = "https://github.com/geragew/agentserial/releases"

[tool.hatch.build.targets.wheel]
packages = ["agentserial"]

[tool.hatch.build.targets.wheel.force-include]
"index.html" = "agentserial/web/index.html"
"styles.css" = "agentserial/web/styles.css"
"app.js" = "agentserial/web/app.js"
"assets" = "agentserial/web/assets"
"README.md" = "agentserial/web/README.md"
"SPEC.md" = "agentserial/web/SPEC.md"
"PRIOR_ART.md" = "agentserial/web/PRIOR_ART.md"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PYI", "RUF", "SIM", "UP"]
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
"agentserial/report.py" = ["E501"]
