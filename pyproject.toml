[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentserial"
version = "0.3.0"
description = "Correctness classification for parallel AI-agent effect histories"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "GERAGEW", email = "GERAGEW@ICLOUD.COM"}]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.116,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.35,<1"]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "hypothesis>=6.130,<7",
  "python-multipart>=0.0.20,<1",
  "pytest>=8.2,<10",
  "uvicorn>=0.35,<1",
]

[project.scripts]
agentserial = "agentserial.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentserial"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
